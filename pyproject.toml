[project]
name = "sec-rag-benchmark"
version = "0.1.0"
description = "Reproducible FinanceBench 10-K benchmark harness"
readme = "README.md"
authors = [
    { name = "14zhasim", email = "zubair.asim.25@ucl.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2==3.1.6",
    "openai==3.8.0",
    "pandas==3.0.5",
    "pymupdf==1.28.2",
    "transformers==5.17.0",
    "xlsxwriter==3.2.9",
]

[project.scripts]
sec-rag-benchmark = "sec_rag_benchmark.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
