[corpus]
prepared_dir = "data/financebench"
parsed_dir = "data/financebench/parsed"
chunks_dir = "data/financebench/chunks"
indexes_dir = "data/financebench/indexes"   # bm25/ and chroma/ go here
expected_documents = 64

[parsing]
provider = "azure-document-intelligence"
model_id = "prebuilt-layout"
output_content_format = "markdown"

[chunking]
floor_tokens = 250         # a heading cut needs both pieces at least this big
ceiling_tokens = 1024      # prose over this is halved at a sentence
overlap_cap_tokens = 100   # most text carried across a page break or halving cut

[bm25]
token_pattern = '(?u)[^\W\d_]+|\d+'  # runs of letters or runs of digits: FY2018 -> fy, 2018
stopwords = "en"                     # bm25s's English stopword list
stemmer = "english"                  # PyStemmer's English stemmer

[embedding]
model = "voyage-4-lite"
batch_size = 128           # chunks per Voyage call (limits: 1,000 texts, 1M tokens)
output_dimension = 1024    # Voyage's default; questions are embedded at the same length
output_dtype = "float"     # Voyage's default, full precision; Chroma stores floats

[retrieval]
candidates_per_search = 50 # BM25 and Chroma each return this many
rrf_k = 60                 # reciprocal rank fusion constant (Cormack et al., 2009)
rerank_candidates = 50     # fused chunks handed to the reranker; the final 10 is
                           # the benchmark's retrieval_depth
