[dataset]
source_dir = "benchmarks/financebench"
output_dir = "data/financebench"
document_type = "10k"
expected_questions = 112
expected_documents = 64

[generation]
provider = "openrouter"
model = "z-ai/glm-5.3-flash"
prompt_version = "financebench-answer-v1"
base_url = "https://openrouter.ai/api/v1"
upstream_provider = "z-ai"
allow_fallbacks = false
context_window_tokens = 1048576
max_output_tokens = 8192
token_safety_margin = 1024
temperature = 0.0
reasoning_effort = "high"
timeout_seconds = 180.0
max_retries = 5

[judge]
provider = "azure"
model = "DeepSeek-V4-Flash"
deployment = "DeepSeek-V4-Flash"
prompt_version = "financebench-binary-judge-v2"
temperature = 0.0
max_output_tokens = 512
timeout_seconds = 180.0
max_retries = 5

[judge_validation]
source_commit = "cc39aeb4afdf33909ee1412188bf89035950c2eb"
seed = 42
correct_examples = 15
incorrect_examples = 10
refusal_examples = 5
minimum_agreement = 0.90

[development_subsets]
seed = 42
smoke_size = 10
pattern_size = 50

[run]
# Exp1, the complete system. Ablations change only `variant` (bm25-only,
# semantic-only, no-rerank, no-query-enhancement: Build Order 2.2). The
# baseline run (closed_book, oracle, long_context) keeps its own snapshot in
# results/20260917-012959--financebench--baseline-context-conditions-v1.
experiment = "exp1"
variant = "full"
conditions = ["single_store", "shared_store"]
retrieval_depth = 10
results_dir = "results"
sec_rag_config = "configs/sec_rag.toml"   # read only when a retrieval condition runs
