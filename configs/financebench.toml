[dataset]
source_dir = "benchmarks/financebench"
output_dir = "data/financebench"
document_type = "10k"
expected_questions = 112
expected_documents = 64

[generation]
provider = "openrouter"
model = "z-ai/glm-5.3-flash"
prompt_version = "financebench-answer-v1"
base_url = "https://openrouter.ai/api/v1"
upstream_provider = "z-ai"
allow_fallbacks = false
context_window_tokens = 1048576
max_output_tokens = 8192
token_safety_margin = 1024
temperature = 0.0
reasoning_effort = "high"
timeout_seconds = 180.0
max_retries = 5

[judge]
provider = "azure"
model = "DeepSeek-V4-Flash"
deployment = "DeepSeek-V4-Flash"
prompt_version = "financebench-binary-judge-v1"
max_output_tokens = 512
timeout_seconds = 180.0
max_retries = 5

[run]
experiment = "financebench"
variant = "baseline-context-conditions-v1"
conditions = ["closed_book", "oracle", "long_context"]
retrieval_depth = 10
results_dir = "results"
